{{- include "migrations-complex.validateMigrations" . }}
{{- include "migrations-complex.validateDatabase" . }}
{{- include "migrations-complex.validateMultiBucketStorage" . }}
{{- include "migrations-complex.validateMinioToS3" . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "migrations-complex.fullname" . }}
  labels:
    {{- include "migrations-complex.labels" . | nindent 4 }}
spec:
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "migrations-complex.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "migrations-complex.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.extraInitContainers }}
      initContainers:
        {{- toYaml .Values.extraInitContainers | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
          # --- Database API Keys Migration ---
            - name: RP_TOKEN_MIGRATION
              value: "{{ .Values.migrations.database.apiKeys.enabled }}"
          # --- Shared Database Configuration ---
          # Database env vars are needed for both API Keys migration and Multi-Bucket to Single-Bucket migration
            {{- if or .Values.migrations.database.apiKeys.enabled .Values.migrations.storage.multiBucketToSingleBucket.enabled }}
            - name: RP_DB_HOST
              value: "{{ .Values.database.endpoint }}"
            - name: RP_DB_USER
              value: "{{ .Values.database.user }}"
            - name: RP_DB_PASS
              {{- if .Values.database.secretName }}
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.database.secretName }}"
                  key: "{{ .Values.database.passwordKeyName }}"
              {{- else }}
              value: "{{ .Values.database.password }}"
              {{- end }}
            - name: RP_DB_NAME
              value: "{{ .Values.database.dbName }}"
            {{- end }}
          # --- Storage: Multi-Bucket to Single-Bucket Migration ---
            - name: RP_SINGLEBUCKET_MIGRATION
              value: "{{ .Values.migrations.storage.multiBucketToSingleBucket.enabled }}"
            {{- if .Values.migrations.storage.multiBucketToSingleBucket.enabled }}
            - name: DATASTORE_TYPE
              value: "{{ .Values.migrations.storage.multiBucketToSingleBucket.destinationType }}"
            {{- if eq .Values.migrations.storage.multiBucketToSingleBucket.destinationType "minio" }}
            {{- if .Values.storage.minio.secretName }}
            - name: DATASTORE_ACCESSKEY
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.storage.minio.secretName }}"
                  key: "{{ .Values.storage.minio.accessKeyName }}"
            - name: DATASTORE_SECRETKEY
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.storage.minio.secretName }}"
                  key: "{{ .Values.storage.minio.secretKeyName }}"
            {{- else }}
            - name: DATASTORE_ACCESSKEY
              value: "{{ .Values.storage.minio.accessKey }}"
            - name: DATASTORE_SECRETKEY
              value: "{{ .Values.storage.minio.secretKey }}"
            {{- end }}
            - name: DATASTORE_ENDPOINT
              value: "{{ if .Values.storage.minio.ssl }}https{{ else }}http{{ end }}://{{ .Values.storage.minio.endpoint }}:{{ .Values.storage.minio.port }}"
            {{ else if eq .Values.migrations.storage.multiBucketToSingleBucket.destinationType "s3" }}
            {{- if .Values.storage.s3.secretName }}
            - name: DATASTORE_ACCESSKEY
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.storage.s3.secretName }}"
                  key: "{{ .Values.storage.s3.accessKeyName }}"
            - name: DATASTORE_SECRETKEY
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.storage.s3.secretName }}"
                  key: "{{ .Values.storage.s3.secretKeyName }}"
            {{- else }}
            - name: DATASTORE_ACCESSKEY
              value: "{{ .Values.storage.s3.accessKey }}"
            - name: DATASTORE_SECRETKEY
              value: "{{ .Values.storage.s3.secretKey }}"
            {{- end }}
            - name: DATASTORE_ENDPOINT
              value: "{{ .Values.storage.s3.endpoint }}"
            {{ end }}
            - name: DATASTORE_BUCKETPREFIX
              value: "{{ .Values.migrations.storage.multiBucketToSingleBucket.buckets.projectPrefix | default "prj-" }}"
            - name: DATASTORE_DEFAULTBUCKETNAME
              value: "{{ .Values.migrations.storage.multiBucketToSingleBucket.buckets.pluginsBucket }}"
            - name: DATASTORE_SINGLEBUCKETNAME
              value: "{{ .Values.migrations.storage.multiBucketToSingleBucket.buckets.singleBucketName }}"
            - name: DATASTORE_REGION
              value: "{{ .Values.storage.s3.region }}"
            - name: DATASTORE_REMOVE_AFTER_MIGRATION
              value: "{{ .Values.migrations.storage.multiBucketToSingleBucket.removeSourceBuckets }}"
            {{- end }}
            # --- Storage: MinIO Single-Bucket to S3 Single-Bucket Migration ---
            - name: RP_MINIO_S3_MIGRATION
              value: "{{ .Values.migrations.storage.minioToS3.enabled }}"
            {{- if .Values.migrations.storage.minioToS3.enabled }}
            - name: MINIO_ENDPOINT
              value: "{{ if .Values.storage.minio.ssl }}https{{ else }}http{{ end }}://{{ .Values.storage.minio.endpoint }}:{{ .Values.storage.minio.port }}"
            {{- if .Values.storage.minio.secretName }}
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.storage.minio.secretName }}"
                  key: "{{ .Values.storage.minio.accessKeyName }}"
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.storage.minio.secretName }}"
                  key: "{{ .Values.storage.minio.secretKeyName }}"
            {{- else }}
            - name: MINIO_ACCESS_KEY
              value: "{{ .Values.storage.minio.accessKey }}"
            - name: MINIO_SECRET_KEY
              value: "{{ .Values.storage.minio.secretKey }}"
            {{- end }}
            - name: S3_ENDPOINT
              value: "{{ .Values.storage.s3.endpoint }}"
            {{- if .Values.storage.s3.secretName }}
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.storage.s3.secretName }}"
                  key: "{{ .Values.storage.s3.accessKeyName }}"
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.storage.s3.secretName }}"
                  key: "{{ .Values.storage.s3.secretKeyName }}"
            {{- else }}
            - name: S3_ACCESS_KEY
              value: "{{ .Values.storage.s3.accessKey }}"
            - name: S3_SECRET_KEY
              value: "{{ .Values.storage.s3.secretKey }}"
            {{- end }}
            - name: MINIO_SINGLE_BUCKET
              value: "{{ .Values.migrations.storage.minioToS3.buckets.sourceBucket }}"
            - name: S3_SINGLE_BUCKET
              value: "{{ .Values.migrations.storage.minioToS3.buckets.destinationBucket }}"
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
