{{- include "migrations-complex.validateDatabase" . }}
{{- include "migrations-complex.validateStorageMigration" . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "migrations-complex.fullname" . }}
  labels:
    {{- include "migrations-complex.labels" . | nindent 4 }}
spec:
  backoffLimit: {{ .Values.backoffLimit | default 0 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "migrations-complex.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "migrations-complex.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.extraInitContainers }}
      initContainers:
        {{- toYaml .Values.extraInitContainers | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            ## Feature flag — this Job always runs the storage migration
            - name: RP_STORAGE_MIGRATION
              value: "true"

            ## --- Source: ReportPortal PostgreSQL ---
            - name: RP_DB_HOST
              value: "{{ .Values.source.database.endpoint }}"
            - name: RP_DB_USER
              value: "{{ .Values.source.database.user }}"
            - name: RP_DB_PASS
              {{- if .Values.source.database.secretName }}
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.source.database.secretName }}"
                  key: "{{ .Values.source.database.passwordKeyName }}"
              {{- else }}
              value: "{{ .Values.source.database.password }}"
              {{- end }}
            - name: RP_DB_NAME
              value: "{{ .Values.source.database.dbName }}"
            - name: RP_DATASOURCE_MAXIMUMPOOLSIZE
              value: "{{ .Values.source.database.maximumPoolSize }}"

            ## --- Bucket layout (source MinIO buckets, destination S3 bucket) ---
            - name: DATASTORE_BUCKETPREFIX
              value: "{{ .Values.source.minio.buckets.projectPrefix }}"
            - name: DATASTORE_DEFAULTBUCKETNAME
              value: "{{ .Values.source.minio.buckets.pluginsBucket }}"
            - name: DATASTORE_SINGLEBUCKETNAME
              value: "{{ .Values.destination.s3.bucket }}"
            - name: DATASTORE_REGION
              value: "{{ .Values.destination.s3.region }}"
            - name: DATASTORE_REMOVE_AFTER_MIGRATION
              value: "{{ .Values.migration.removeSourceBucketsAfterMigration }}"

            ## --- Source: MinIO ---
            {{- if .Values.source.minio.secretName }}
            - name: MIGRATION_STORAGE_SOURCE_ACCESSKEY
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.source.minio.secretName }}"
                  key: "{{ .Values.source.minio.accessKeyName }}"
            - name: MIGRATION_STORAGE_SOURCE_SECRETKEY
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.source.minio.secretName }}"
                  key: "{{ .Values.source.minio.secretKeyName }}"
            {{- else }}
            - name: MIGRATION_STORAGE_SOURCE_ACCESSKEY
              value: "{{ .Values.source.minio.accessKey }}"
            - name: MIGRATION_STORAGE_SOURCE_SECRETKEY
              value: "{{ .Values.source.minio.secretKey }}"
            {{- end }}
            - name: MIGRATION_STORAGE_SOURCE_ENDPOINT
              value: {{ include "migrations-complex.sourceMinioUrl" . | quote }}
            - name: MIGRATION_STORAGE_SOURCE_REGION
              value: "{{ .Values.source.minio.region }}"

            ## --- Destination: AWS S3 ---
            {{- if .Values.destination.s3.secretName }}
            - name: MIGRATION_STORAGE_DESTINATION_ACCESSKEY
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.destination.s3.secretName }}"
                  key: "{{ .Values.destination.s3.accessKeyName }}"
            - name: MIGRATION_STORAGE_DESTINATION_SECRETKEY
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.destination.s3.secretName }}"
                  key: "{{ .Values.destination.s3.secretKeyName }}"
            {{- else }}
            - name: MIGRATION_STORAGE_DESTINATION_ACCESSKEY
              value: "{{ .Values.destination.s3.accessKey }}"
            - name: MIGRATION_STORAGE_DESTINATION_SECRETKEY
              value: "{{ .Values.destination.s3.secretKey }}"
            {{- end }}
            - name: MIGRATION_STORAGE_DESTINATION_REGION
              value: "{{ .Values.destination.s3.region }}"
            - name: MIGRATION_STORAGE_DESTINATION_ENDPOINT
              value: {{ include "migrations-complex.destinationS3Url" . | quote }}

            ## --- Migration tuning ---
            - name: MIGRATION_STORAGE_MAX_IN_MEMORY_COPY_MB
              value: "{{ .Values.migration.maxInMemoryCopyMb }}"
            - name: MIGRATION_PARALLELISM
              value: "{{ .Values.migration.parallelism }}"
            - name: MIGRATION_INTRA_PROJECT_PARALLELISM
              value: "{{ .Values.migration.intraProjectParallelism }}"
            - name: MIGRATION_BATCH_SIZE
              value: "{{ .Values.migration.batchSize }}"
            - name: MIGRATION_PROGRESS_LOG_INTERVAL
              value: "{{ .Values.migration.progressLogInterval }}"
            - name: MIGRATION_DB_ATTACHMENT_UPDATE_BATCH_SIZE
              value: "{{ .Values.migration.attachmentUpdateBatchSize }}"
            - name: MIGRATION_DB_ATTACHMENT_CREATION_DATE_COLUMN
              value: "{{ .Values.migration.attachmentCreationDateColumn }}"
            - name: MIGRATION_DB_ATTACHMENT_CUTOFF
              value: "{{ .Values.migration.attachmentCutoff }}"
            - name: MIGRATION_S3_VERIFY_DESTINATION_AFTER_COPY
              value: "{{ .Values.migration.verifyDestinationAfterCopy }}"
            - name: MIGRATION_S3_HEAD_SOURCE_BEFORE_COPY
              value: "{{ .Values.migration.headSourceBeforeCopy }}"

            ## --- JVM ---
            - name: JAVA_OPTS
              value: "{{ .Values.jvmArgs }}"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
