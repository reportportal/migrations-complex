##
## MinIO multi-bucket → AWS S3 single-bucket migration (one Kubernetes Job).
##
database:
  secretName: ""
  passwordKeyName: "postgresql-password"
  endpoint: postgresql.postgresql.svc.cluster.local
  port: 5432
  user: rpuser
  dbName: reportportal
  password: ""
  maximumPoolSize: 20

storage:
  minio:
    secretName: ""
    accessKey: ""
    secretKey: ""
    accessKeyName: "access-key"
    secretKeyName: "secret-key"
    endpoint: minio.minio.svc.cluster.local
    ssl: false
    port: 9000
  s3:
    region: "eu-central-1"
    secretName: ""
    accessKey: ""
    secretKey: ""
    accessKeyName: "access-key"
    secretKeyName: "secret-key"
    ssl: true
    endpoint: s3.eu-central-1.amazonaws.com

migration:
  # S3 bucket that will be created if missing (must match storage.s3.region).
  destinationBucket: "rp-iaas-epam-production-rp-storage"
  projectBucketPrefix: "prj-"
  pluginsBucket: "rp-bucket"
  removeSourceBucketsAfterMigration: false
  sourceRegion: "us-east-1"
  s3DestinationEndpointOverride: ""
  maxInMemoryCopyMb: 128
  parallelism: 8
  intraProjectParallelism: 16
  batchSize: 500000
  progressLogInterval: 5000
  attachmentUpdateBatchSize: 1000
  # Column name on public.attachment for creation-date cutoff (maps to MIGRATION_DB_ATTACHMENT_CREATION_DATE_COLUMN)
  attachmentCreationDateColumn: creation_date
  # Max creation time to migrate (UTC / ISO-8601 / epoch ms). Empty = use JVM "now" at project-data start (MIGRATION_DB_ATTACHMENT_CUTOFF)
  attachmentCutoff: ""
  verifyDestinationAfterCopy: true
  headSourceBeforeCopy: true

image:
  repository: reportportal/migrations-complex
  tag: "1.0.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 248Mi

backoffLimit: 0
jvmArgs: "-Xmx4g -XX:+UseG1GC -XX:InitiatingHeapOccupancyPercent=70"

extraInitContainers: []
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podSecurityContext: {}
securityContext: {}

serviceAccount:
  create: true
  annotations: {}
  name: ""
