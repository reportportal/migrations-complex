rp:
  # Enable the only migration this service runs: MinIO multi-bucket → AWS S3 single bucket.
  storage:
    migration: true

  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driverClassName: org.postgresql.Driver
    jdbcUrl: ${rp.db.url}
    username: ${rp.db.user}
    password: ${rp.db.pass}
    maximumPoolSize: ${rp.datasource.maximumPoolSize:20}

  db:
    url: jdbc:postgresql://${rp.db.host}:${rp.db.port}/${rp.db.name}
    name: reportportal
    port: 5432
    user: rpuser
    pass: rppass

# Logical bucket layout and destination bucket name (S3).
datastore:
  bucketPrefix: prj-
  defaultBucketName: rp-bucket
  singleBucketName:
  secrets:
    path: keystore
  remove:
    after:
      migration: false

# MinIO (source) and AWS S3 (destination) credentials for the SDK clients.
migration:
  storage:
    source:
      accessKey: ""
      secretKey: ""
      endpoint: "http://minio:9000"
      region: us-east-1
    destination:
      accessKey: ""
      secretKey: ""
      region: eu-central-1
      endpoint: ""
    max-in-memory-copy-mb: 128
  batch:
    size: 500000
  intra-project:
    parallelism: 16
  parallelism: 8
  retry:
    max: 3
    base-delay-ms: 1000
  progress:
    log-interval: 5000
  db:
    attachment-update-batch-size: 1000
    # Column on public.attachment for migration cutoff; env: MIGRATION_DB_ATTACHMENT_CREATION_DATE_COLUMN
    attachment-creation-date-column: creation_date
    # Cutoff instant (optional). Empty = Instant.now() when project-data migration starts.
    # Else: ISO-8601 (2026-03-26T18:31:59.509Z), epoch millis, or yyyy-MM-dd HH:mm:ss[.SSS] as UTC.
    # Env: MIGRATION_DB_ATTACHMENT_CUTOFF
    attachment-cutoff: ""
  s3:
    target-throughput-gbps: 20.0
    min-part-size-mb: 8
    verify-destination-after-copy: true
    head-source-before-copy: true
